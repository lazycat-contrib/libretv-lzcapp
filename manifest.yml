name: LibreTV
package: cloud.lazycat.app.libretv
version: 0.0.13
min_os_version: 1.3.8
description: 免费在线视频搜索与观看平台
homepage: https://github.com/bestZwei/LibreTV
author: bestZwei
application:
    subdomain: libretv
    background_task: false
    public_path:
        - /
    routes:
        - /=http://libretv:8080/
services:
    libretv:
        # bestzwei/libretv:latest
        image: rregistry.lazycat.cloud/czyt/bestzwei/libretv:136734c50b7a8070
        environment:
 {{if .U.enable_auth}}
          - PASSWORD={{.U.access_password}}
{{end}}
